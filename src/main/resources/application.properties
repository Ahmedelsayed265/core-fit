spring.application.name=core-fit
server.port=${PORT:8000}

## db config
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

## Hibernate SQL Logging
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type=info
logging.level.org.hibernate.stat=info
logging.level.org.springframework=DEBUG
logging.level.org.hibernate=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.generate_statistics=true

## JDBC Time Zone
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

## mail sender
spring.mail.host=${MailHost}
spring.mail.port=${MailPort}
spring.mail.username=${MailUser}
spring.mail.password=${MailPass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

## Redis Configuration
spring.data.redis.host=${ValkeyHost}
spring.data.redis.port=${ValkeyPort}
spring.data.redis.ssl.enabled=true

## cloud config
cloudinary.cloud-name=${CloudName}
cloudinary.api-key=${CloudApiKey}
cloudinary.api-secret=${CloudApiSecret}
cloudinary.base-location=corefit/test

## images uploading
spring.web.resources.static-locations=file:uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

## firebase config
firebase.config=${FIREBASE_CONFIG}

## stripe secret key
stripe.secret.key=${STRIPE_SECRET}
production.url=${PRODUCTION_DOMAIN}
