name: CI/CD Docker to ECR + EC2 Deploy

on:
  push:
    branches:
      - dev

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set environment variables
        run: |
          echo "IMAGE_TAG=dev-${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "ECR_REGISTRY=public.ecr.aws/u6h5x3y1" >> $GITHUB_ENV
          echo "IMAGE_NAME=corefit/devrepo" >> $GITHUB_ENV
          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
          echo "EC2_INSTANCE_ID=${{ secrets.EC2_INSTANCE_ID }}" >> $GITHUB_ENV
          echo "EC2_USER=ec2-user" >> $GITHUB_ENV
          echo "EC2_PUBLIC_IP=${{ secrets.EC2_PUBLIC_IP }}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        env:
          AWS_REGION: us-east-1
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Build, tag, and push Docker image
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          docker tag $IMAGE_NAME:$IMAGE_TAG $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          docker push $ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG

      - name: Generate temporary SSH key
        run: |
          ssh-keygen -t rsa -b 2048 -f temp_key -N ""
          echo "TEMP_KEY=temp_key" >> $GITHUB_ENV

      - name: Send temporary SSH public key to EC2 via Instance Connect
        run: |
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id $EC2_INSTANCE_ID \
            --availability-zone $(aws ec2 describe-instances --instance-ids $EC2_INSTANCE_ID --query "Reservations[0].Instances[0].Placement.AvailabilityZone" --output text) \
            --instance-os-user $EC2_USER \
            --ssh-public-key file://$TEMP_KEY.pub

      - name: Deploy Docker container on EC2
        run: |
          chmod 600 $TEMP_KEY
          ssh -i $TEMP_KEY -o StrictHostKeyChecking=no $EC2_USER@$EC2_PUBLIC_IP << EOF
            docker pull public.ecr.aws/u6h5x3y1/corefit/devrepo:${IMAGE_TAG}
            docker stop corefit-app || true
            docker rm corefit-app || true
            docker run -d --env-file /opt/corefit/app.env --name corefit-app public.ecr.aws/u6h5x3y1/corefit/devrepo:${IMAGE_TAG}
          EOF

      - name: Clean up temporary key
        run: |
          rm -f temp_key temp_key.pub
